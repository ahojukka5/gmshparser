site_name: gmshparser
site_description: A lightweight Python package for parsing ASCII Gmsh MSH files
site_author: Jukka Aho
site_url: https://ahojukka5.github.io/gmshparser/
repo_url: https://github.com/ahojukka5/gmshparser
repo_name: ahojukka5/gmshparser

watch:
  - README.md

hooks:
  - docs_hooks.py

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - User Guide:
      - Overview: user-guide/index.md
      - Getting Started: user-guide/getting-started.md
      - Installation: user-guide/installation.md
      - Modern Data Model: user-guide/pythonic-api.md
      - Working with Meshes: user-guide/basic-usage.md
      - Physical Groups and Periodicity: user-guide/physical-groups.md
      - NumPy Interoperability: user-guide/numpy.md
      - Error Handling: user-guide/error-handling.md
      - Command Line Interface: user-guide/cli.md
      - Visualization: user-guide/visualization.md
      - Supported Formats: user-guide/supported-formats.md
      - Migrating from the Compatibility API: user-guide/migration.md
  - Developer Guide:
      - Overview: developer-guide/index.md
      - Architecture: developer-guide/architecture.md
      - Contributing: developer-guide/contributing.md
      - Writing Parsers: developer-guide/writing-parsers.md
      - Parser Internals: developer-guide/parser-internals.md
      - Testing: developer-guide/testing.md
      - Performance Benchmarks: developer-guide/benchmarks.md
      - Test Results: developer-guide/test-results.md
  - API Reference:
      - Overview: api/overview.md
      - Package API: api/package.md
      - Modern API: api/modern.md
      - NumPy API: api/numpy.md
      - Errors: api/errors.md
      - Compatibility API: api/mesh.md
      - Helpers: api/helpers.md
