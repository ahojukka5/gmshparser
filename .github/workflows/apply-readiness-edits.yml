name: Apply 0.4 readiness edits

on:
  push:
    branches: [agent/0.4-readiness]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/0.4-readiness

      - name: Apply repository edits
        run: |
          python3 - <<'PY'
          from pathlib import Path


          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              content = target.read_text(encoding="utf-8")
              if old not in content:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              target.write_text(content.replace(old, new, 1), encoding="utf-8")


          replace(
              "gmshparser/modern_builder.py",
              "entity_keys = dict.fromkeys([*nodes_by_entity, *elements_by_entity])",
              "entity_keys = dict.fromkeys(\n"
              "            [*self._entity_physical_tags, *nodes_by_entity, *elements_by_entity]\n"
              "        )",
          )

          replace(
              "gmshparser/mesh.py",
              "    def set_element_physical_tags(self, element_tag: int, physical_tags):\n",
              "    def get_entity_physical_assignments(\n"
              "        self,\n"
              "    ) -> dict[tuple[int, int], tuple[int, ...]]:\n"
              "        \"\"\"Return all declared elementary-entity physical assignments.\"\"\"\n"
              "        return dict(self.entity_physical_tags_)\n\n"
              "    def set_element_physical_tags(self, element_tag: int, physical_tags):\n",
          )

          replace(
              "gmshparser/api.py",
              "entity_keys = dict.fromkeys([*nodes_by_entity, *elements_by_entity])",
              "entity_keys = dict.fromkeys(\n"
              "            [\n"
              "                *mesh.get_entity_physical_assignments(),\n"
              "                *nodes_by_entity,\n"
              "                *elements_by_entity,\n"
              "            ]\n"
              "        )",
          )

          replace(
              "gmshparser/__init__.py",
              "from . import api, helpers\n",
              "from importlib.metadata import version as _distribution_version\n\n"
              "from . import api, helpers\n",
          )
          replace(
              "gmshparser/__init__.py",
              '__version__ = "0.3.1"',
              '__version__ = _distribution_version("gmshparser")',
          )

          replace(
              "tests/test_cli.py",
              "import pytest\n\nfrom gmshparser.cli import main\n",
              "import pytest\n\nimport gmshparser\nfrom gmshparser.cli import main\n",
          )
          replace(
              "tests/test_cli.py",
              'assert capsys.readouterr().out.strip() == "gmshparser 0.3.1"',
              'assert capsys.readouterr().out.strip() == f"gmshparser {gmshparser.__version__}"',
          )

          Path("tests/test_declared_entities.py").write_text(
              '''from io import StringIO

import pytest

import gmshparser


MESH = """$MeshFormat
4.1 0 8
$EndMeshFormat
$PhysicalNames
1
0 7 "Probe"
$EndPhysicalNames
$Entities
2 0 0 0
1 0 0 0 1 7
2 1 0 0 1 8
$EndEntities
"""


def _read_direct(source: str):
    return gmshparser.read(StringIO(source), name="declared-entities.msh")


def _read_through_legacy(source: str):
    legacy = gmshparser.Mesh()
    legacy.set_name("declared-entities.msh")
    gmshparser.MainParser().parse(legacy, StringIO(source))
    return gmshparser.ModernMesh.from_legacy(legacy)


@pytest.mark.parametrize("loader", [_read_direct, _read_through_legacy])
def test_declared_entities_survive_without_mesh_blocks(loader):
    mesh = loader(MESH)

    probe_entity = mesh.entities[(0, 1)]
    anonymous_entity = mesh.entities[(0, 2)]

    assert len(mesh.entities) == 2
    assert probe_entity.physical_tags == (7,)
    assert anonymous_entity.physical_tags == (8,)
    assert len(probe_entity.nodes) == 0
    assert len(probe_entity.elements) == 0

    probe = mesh.physical_groups["Probe"]
    anonymous = mesh.physical_groups[(0, 8)]

    assert probe.entities[(0, 1)] is probe_entity
    assert anonymous.name is None
    assert anonymous.entities[(0, 2)] is anonymous_entity
    assert len(probe.nodes) == 0
    assert len(probe.elements) == 0
''',
              encoding="utf-8",
          )

          Path("tests/test_version_metadata.py").write_text(
              '''from importlib.metadata import version
from pathlib import Path
import tomllib

import gmshparser


def test_runtime_version_matches_project_metadata():
    with Path("pyproject.toml").open("rb") as project_file:
        project_version = tomllib.load(project_file)["project"]["version"]

    assert version("gmshparser") == project_version
    assert gmshparser.__version__ == project_version
''',
              encoding="utf-8",
          )

          replace(
              "pyproject.toml",
              'readme = "README.md"\n',
              'readme = "README.md"\nlicense = "MIT"\nlicense-files = ["LICENSE"]\n',
          )

          replace(
              ".github/workflows/python-publish.yml",
              "      - name: Build distributions\n",
              "      - name: Verify release tag matches package version\n"
              "        env:\n"
              "          RELEASE_TAG: ${{ github.event.release.tag_name }}\n"
              "        run: |\n"
              "          python - <<'PY'\n"
              "          import os\n"
              "          import tomllib\n\n"
              "          with open(\"pyproject.toml\", \"rb\") as project_file:\n"
              "              package_version = tomllib.load(project_file)[\"project\"][\"version\"]\n\n"
              "          release_tag = os.environ[\"RELEASE_TAG\"]\n"
              "          expected_tag = f\"v{package_version}\"\n"
              "          if release_tag != expected_tag:\n"
              "              raise SystemExit(\n"
              "                  f\"Release tag {release_tag!r} does not match {expected_tag!r}\"\n"
              "              )\n"
              "          PY\n\n"
              "      - name: Build distributions\n",
          )

          replace(
              "docs/developer-guide/test-results.md",
              "uv run --no-sync ruff format --check gmshparser tests examples\n"
              "uv run --no-sync ruff check gmshparser tests examples",
              "uv run --no-sync ruff format --check gmshparser tests examples benchmarks\n"
              "uv run --no-sync ruff check gmshparser tests examples benchmarks",
          )
          replace(
              "docs/developer-guide/test-results.md",
              "The current data model does not expose complete physical-name or physical-tag\n"
              "metadata, so the presence of such tags in a fixture should not be described as\n"
              "full physical-group support.",
              "Physical-name and physical-tag coverage includes named and anonymous groups,\n"
              "entity assignments, element assignments, and resolution to participating nodes.\n"
              "Declared MSH 4 entities are also tested when they have no node or element blocks.",
          )

          replace(
              "docs/user-guide/supported-formats.md",
              "Entity physical assignments are retained. Bounding boxes and boundary-entity\n"
              "records are validated while reading `$Entities`, but they are not yet exposed in\n"
              "the public model.",
              "Entity declarations and physical assignments are retained even when an entity has\n"
              "no node or element block. Bounding boxes and boundary-entity records are validated\n"
              "while reading `$Entities`, but they are not yet exposed in the public model.",
          )

          old_release = '''## Release process

For maintainers:

1. Update the version in `pyproject.toml` and `gmshparser/__init__.py`.
2. Update the changelog.
3. Build locally with `uv build --no-sources`.
4. Create and publish the GitHub release.
5. The release workflow builds and smoke-tests both distributions.
6. `uv publish` obtains a short-lived PyPI credential through GitHub OIDC.

The PyPI project must have a trusted publisher matching:
'''
          new_release = '''## Release process

For maintainers:

1. Update only `[project].version` in `pyproject.toml`.
2. Move the changelog entries from `[Unreleased]` to the dated release section.
3. Build locally with `uv build --no-sources`.
4. Create and publish a GitHub release tagged `v<project-version>`.
5. The release workflow verifies that the tag matches the project version.
6. The workflow builds and smoke-tests both distributions.
7. `uv publish` obtains a short-lived PyPI credential through GitHub OIDC.

`gmshparser.__version__` and the CLI version are read from installed distribution
metadata, which is generated from `pyproject.toml`; they must not be edited
separately.

The PyPI project must have a trusted publisher matching:
'''
          replace("docs/developer-guide/contributing.md", old_release, new_release)

          replace(
              "docs/about/changelog.md",
              "### Changed\n\n",
              "### Changed\n\n"
              "- made `[project].version` in `pyproject.toml` the single writable source\n"
              "  for package, runtime, and CLI version reporting\n"
              "- made the release workflow reject Git tags that do not match the package\n"
              "  version\n"
              "- added explicit MIT license metadata to built distributions\n",
          )
          replace(
              "docs/about/changelog.md",
              "### Fixed\n\n",
              "### Fixed\n\n"
              "- retained MSH 4 entities and their physical groups even when they have no\n"
              "  node or element blocks in both direct and legacy-conversion paths\n"
              "- corrected stale physical-group and quality-command documentation\n",
          )
          PY

      - name: Commit edits
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gmshparser tests pyproject.toml docs .github/workflows/python-publish.yml
          git commit -m "Prepare 0.4 release foundations"
          git push origin HEAD:agent/0.4-readiness
