name: Publish Python package to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: "release: publish to PyPI"
    runs-on: self-hosted
    environment:
      name: pypi
      url: https://pypi.org/project/gmshparser/
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as project_file:
              package_version = tomllib.load(project_file)["project"]["version"]

          release_tag = os.environ["RELEASE_TAG"]
          expected_tag = f"v{package_version}"
          if release_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {release_tag!r} does not match {expected_tag!r}"
              )
          PY

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke test wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "import gmshparser"
          uv run --isolated --no-project --with dist/*.whl python -c "from importlib.resources import files; assert files('gmshparser').joinpath('py.typed').is_file()"
          uv run --isolated --no-project --with dist/*.whl gmshparser --version

      - name: Smoke test source distribution
        run: |
          uv run --isolated --no-project --with dist/*.tar.gz python -c "import gmshparser"
          uv run --isolated --no-project --with dist/*.tar.gz python -c "from importlib.resources import files; assert files('gmshparser').joinpath('py.typed').is_file()"
          uv run --isolated --no-project --with dist/*.tar.gz gmshparser --version

      - name: Publish distributions to PyPI
        run: uv publish
