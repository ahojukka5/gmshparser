name: Run 0.4 readiness edits

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/0.4-readiness'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Apply edits
        run: python3 .github/scripts/apply_readiness_edits.py

      - name: Commit edits
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gmshparser tests pyproject.toml docs .github/workflows/python-publish.yml
          git commit -m "Prepare 0.4 release foundations"
          git push origin HEAD:${{ github.head_ref }}
