name: Apply structured parse error fixes

on:
  push:
    branches: [structured-parse-errors]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: uv sync --no-default-groups --group lint
      - name: Apply guarded fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("gmshparser/parsing.py")
          text = path.read_text()
          old = '''    if isinstance(error, ParseError):
              return error.with_context(context)
          '''
          new = '''    if isinstance(error, ParseError):
              if (
                  error.filename is not None
                  or error.line_number is not None
                  or error.section is not None
              ):
                  return error
              return error.with_context(context)
          '''
          if old not in text:
              raise SystemExit("parsing.py target not found")
          path.write_text(text.replace(old, new, 1))

          path = Path("tests/test_mesh_format_parser.py")
          text = path.read_text()
          old = 'data = io.StringIO("4.1 0 8")'
          new = 'data = io.StringIO("4.1 0 8\\n$EndMeshFormat\\n")'
          if old not in text:
              raise SystemExit("mesh format test target not found")
          path.write_text(text.replace(old, new, 1))

          path = Path("tests/test_element_types.py")
          text = path.read_text()
          old = 'StringIO("1 1 1 1\\n3 7 999 1\\n1 10 20 30\\n"),'
          new = 'StringIO("1 1 1 1\\n3 7 999 1\\n1 10 20 30\\n$EndElements\\n"),'
          if old not in text:
              raise SystemExit("element type test target not found")
          path.write_text(text.replace(old, new, 1))
          PY
          uv run --no-sync ruff format gmshparser tests examples
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gmshparser tests
          if git diff --cached --quiet; then
            echo "No fixes needed"
          else
            git commit -m "Fix structured parse error regressions"
            git push origin HEAD:${{ github.ref_name }}
          fi
