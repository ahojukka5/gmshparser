name: Finalize release documentation

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'release/0.4.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Update release documentation
        shell: bash
        run: |
          set -o pipefail
          python3 .github/scripts/finalize_release_docs.py 2>&1 | tee release-docs.txt

      - name: Upload documentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-documentation-diagnostics
          path: release-docs.txt
          if-no-files-found: ignore

      - name: Commit documentation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs
          git commit -m "Document 0.4 typing and release checks"
          git push origin HEAD:${{ github.head_ref }}
