name: Polish Pythonic API

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  polish:
    if: github.head_ref == 'agent/pythonic-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Polish public module declarations
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("gmshparser/api.py")
          text = path.read_text()
          text = text.replace(
              "from typing import TextIO, TypeVar, cast",
              "from typing import TextIO, cast",
          )
          text = text.replace(
              '\nT = TypeVar("T")\nE = TypeVar("E")\n\n',
              '''

__all__ = [
    "Element",
    "ElementCollection",
    "ElementEntity",
    "EntityCollection",
    "Mesh",
    "Node",
    "NodeCollection",
    "NodeEntity",
    "TaggedCollection",
    "read",
]

''',
          )
          path.write_text(text)
          PY

      - name: Verify quality and behavior
        run: |
          uv sync --no-default-groups --group test --group lint
          uv run --no-sync ruff format gmshparser tests examples
          uv run --no-sync ruff check gmshparser tests examples
          uv run --no-sync pytest

      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gmshparser/api.py
          if git diff --cached --quiet; then
            echo "No polish changes"
            exit 0
          fi
          git commit -m "Polish Pythonic API exports"
          git push origin HEAD:${{ github.head_ref }}
