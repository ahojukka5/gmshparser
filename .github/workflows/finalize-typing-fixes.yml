name: Finalize typing fixes

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'release/0.4.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Apply final fixes
        run: python3 .github/scripts/finalize_typing_fixes.py

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Install lint dependencies
        run: uv sync --no-default-groups --group lint

      - name: Apply Ruff fixes and formatting
        run: |
          uv run --no-sync ruff check --fix gmshparser tests examples benchmarks
          uv run --no-sync ruff format gmshparser tests examples benchmarks

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gmshparser tests examples benchmarks
          git commit -m "Finalize typing fixes and formatting"
          git push origin HEAD:${{ github.head_ref }}
