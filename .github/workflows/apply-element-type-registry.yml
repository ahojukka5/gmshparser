name: Apply element type registry

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/element-type-registry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Apply guarded source and documentation migrations
        run: |
          if grep -q "from .element_types import ElementFamily" gmshparser/api.py; then
            echo "Element registry migration already applied"
          else
            python scripts/apply_element_type_registry.py
            python scripts/update_element_type_docs.py
          fi

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Install development dependencies
        run: uv sync --no-default-groups --group lint --group test --group docs

      - name: Format and fix safe lint findings
        run: |
          uv run --no-sync ruff format gmshparser tests examples
          uv run --no-sync ruff check --fix gmshparser tests examples

      - name: Commit migrated registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gmshparser tests docs
          if git diff --cached --quiet; then
            echo "No registry changes"
            exit 0
          fi
          git commit -m "Centralize Gmsh element type metadata"
          git push origin HEAD:${{ github.head_ref }}

      - name: Validate registry implementation
        run: |
          uv run --no-sync ruff check gmshparser tests examples
          uv run --no-sync pytest
          uv run --no-sync mkdocs build --strict
