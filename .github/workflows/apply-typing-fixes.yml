name: Apply typing fixes

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'release/0.4.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Apply fixes
        run: python3 .github/scripts/apply_typing_fixes.py

      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gmshparser docs
          git commit -m "Fix package typing and strict documentation"
          git push origin HEAD:${{ github.head_ref }}
