name: Diagnose Pythonic API lint

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'agent/pythonic-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Install quality dependencies
        run: uv sync --no-default-groups --group lint

      - name: Collect Ruff diagnostics
        run: uv run --no-sync ruff check --output-format=concise gmshparser tests examples > ruff.txt || true

      - name: Upload Ruff diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: pythonic-api-lint-diagnostics
          path: ruff.txt
