name: Ruff modernization refactor

on:
  push:
    branches: [agent/ruff-modernization]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ruff-modernization

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Install development dependencies
        run: uv sync --no-default-groups --group test --group lint

      - name: Apply Ruff fixes
        run: |
          uv run --no-sync ruff check --fix --unsafe-fixes gmshparser tests examples
          uv run --no-sync ruff format gmshparser tests examples

      - name: Verify Ruff and tests
        run: |
          uv run --no-sync ruff format --check gmshparser tests examples
          uv run --no-sync ruff check gmshparser tests examples
          uv run --no-sync pytest

      - name: Commit refactoring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gmshparser tests examples
          if git diff --cached --quiet; then
            echo "No Ruff changes to commit"
            exit 0
          fi
          git commit -m "Apply Ruff modernization fixes"
          git push origin HEAD:agent/ruff-modernization
