name: Diagnose structured parse errors

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'structured-parse-errors'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: uv sync --no-default-groups --group test --group lint
      - name: Capture diagnostics
        id: diagnostics
        continue-on-error: true
        run: |
          set +e
          uv run --no-sync pytest -q --tb=short > pytest.txt 2>&1
          pytest_status=$?
          uv run --no-sync ruff format --check --diff gmshparser tests examples > ruff-format.txt 2>&1
          format_status=$?
          uv run --no-sync ruff check gmshparser tests examples > ruff-lint.txt 2>&1
          lint_status=$?
          echo "status=$((pytest_status || format_status || lint_status))" >> "$GITHUB_OUTPUT"
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structured-parse-errors-diagnostics
          path: |
            pytest.txt
            ruff-format.txt
            ruff-lint.txt
      - name: Propagate result
        run: test "${{ steps.diagnostics.outputs.status }}" = "0"
