name: MSH 4.0 diagnostics

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --no-default-groups --group lint --group test

      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          uv run --no-sync ruff check gmshparser tests > ruff.txt 2>&1
          echo $? > ruff.exit
          uv run --no-sync pytest -q -x --tb=short > pytest.txt 2>&1
          echo $? > pytest.exit
          cat ruff.exit pytest.exit

      - name: Upload diagnostics
        uses: actions/upload-artifact@v6
        with:
          name: msh40-diagnostics
          path: |
            ruff.txt
            ruff.exit
            pytest.txt
            pytest.exit
