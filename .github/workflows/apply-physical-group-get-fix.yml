name: Apply physical group get fix

on:
  push:
    branches: [fix-physical-group-get]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-physical-group-get
      - name: Apply focused fix
        run: |
          python - <<'PY'
          from pathlib import Path

          api_path = Path("gmshparser/api.py")
          api = api_path.read_text()
          collection_start = api.index("class PhysicalGroupCollection:")
          method_start = api.index("    def get(\n", collection_start)
          method_end = api.index("\n    def where(", method_start)
          new_method = "\n".join(
              [
                  "    def get(",
                  "        self,",
                  "        key: PhysicalGroupKey | str,",
                  "        default: PhysicalGroup | None = None,",
                  "    ) -> PhysicalGroup | None:",
                  "        \"\"\"Return a physical group, or *default* only when the key is absent.",
                  "",
                  "        Ambiguous names still raise :class:`KeyError`; callers must use the",
                  "        explicit ``(dimension, tag)`` key in that case.",
                  "        \"\"\"",
                  "        if isinstance(key, str):",
                  "            matches = self._by_name.get(key, ())",
                  "            if len(matches) == 1:",
                  "                return matches[0]",
                  "            if not matches:",
                  "                return default",
                  "            raise KeyError(",
                  "                f\"Physical group name {key!r} is ambiguous; \"",
                  "                \"use (dimension, tag)\"",
                  "            )",
                  "        return self._by_key.get(key, default)",
              ]
          ) + "\n"
          api_path.write_text(api[:method_start] + new_method + api[method_end:])

          changelog_path = Path("docs/about/changelog.md")
          changelog = changelog_path.read_text()
          heading = "### Fixed\n\n"
          insertion = (
              "- made `PhysicalGroupCollection.get()` return its default only for "
              "missing\n"
              "  keys while preserving `KeyError` for ambiguous physical-group "
              "names\n"
          )
          position = changelog.index(heading) + len(heading)
          if insertion not in changelog:
              changelog = changelog[:position] + insertion + changelog[position:]
          changelog_path.write_text(changelog)
          PY
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: uv sync --no-default-groups --group lint
      - run: uv run --no-sync ruff format gmshparser tests
      - uses: actions/upload-artifact@v4
        with:
          name: physical-group-get-fix-files
          path: |
            gmshparser/api.py
            docs/about/changelog.md
            tests/test_physical_group_collection.py
          if-no-files-found: error
      - name: Commit changes
        continue-on-error: true
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gmshparser/api.py docs/about/changelog.md tests/test_physical_group_collection.py
          git commit -m "Fix ambiguous physical group get"
          git push origin HEAD:fix-physical-group-get
