name: Apply invalid mesh errors

on:
  push:
    branches: [structured-parse-errors]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: uv sync --no-default-groups --group lint
      - name: Patch modern mesh validation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("gmshparser/api.py")
          text = path.read_text()

          old = '''from .element_types import ElementFamily, ElementType, ElementTypeInfo
          from .main_parser import MainParser
          '''
          new = '''from .element_types import ElementFamily, ElementType, ElementTypeInfo
          from .errors import InvalidMeshError
          from .main_parser import MainParser
          '''
          if old not in text:
              raise SystemExit("api import target not found")
          text = text.replace(old, new, 1)

          old = '''                    raise ValueError(
                              f"Node {legacy_node.get_tag()} has fewer than three coordinates"
                          )
          '''
          new = '''                    raise InvalidMeshError(
                              f"Node {legacy_node.get_tag()} has fewer than three coordinates",
                              filename=mesh.get_name(),
                          )
          '''
          if old not in text:
              raise SystemExit("node validation target not found")
          text = text.replace(old, new, 1)

          old = '''                        raise ValueError(
                                  f"Element {legacy_element.get_tag()} references "
                                  f"unknown node {node_tag}"
                              )
          '''
          new = '''                        raise InvalidMeshError(
                                  f"Element {legacy_element.get_tag()} references "
                                  f"unknown node {node_tag}",
                                  filename=mesh.get_name(),
                              )
          '''
          if old not in text:
              raise SystemExit("element validation target not found")
          path.write_text(text.replace(old, new, 1))
          PY
          uv run --no-sync ruff format gmshparser/api.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gmshparser/api.py
          if git diff --cached --quiet; then
            echo "No patch needed"
          else
            git commit -m "Use structured invalid mesh errors"
            git push origin HEAD:${{ github.ref_name }}
          fi
