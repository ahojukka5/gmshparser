name: Format Pythonic API

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/pythonic-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Install Ruff
        run: uv sync --no-default-groups --group lint

      - name: Format Python sources
        run: uv run --no-sync ruff format gmshparser tests examples

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gmshparser tests examples
          if git diff --cached --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git commit -m "Format Pythonic API"
          git push origin HEAD:${{ github.head_ref }}
