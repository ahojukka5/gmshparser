name: Refine modern API

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'agent/physical-groups-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Apply guarded API patch
        run: |
          if grep -q "class PhysicalGroup" gmshparser/api.py; then
            echo "API patch already applied"
          else
            python scripts/refine_modern_api.py
          fi

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Install development dependencies
        run: uv sync --no-default-groups --group lint --group test

      - name: Format sources
        run: uv run --no-sync ruff format gmshparser tests examples

      - name: Commit refined API
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gmshparser tests examples
          if git diff --cached --quiet; then
            echo "No API changes"
            exit 0
          fi
          git commit -m "Refine modern API around physical groups"
          git push origin HEAD:${{ github.head_ref }}

      - name: Validate lint and tests
        run: |
          uv run --no-sync ruff check gmshparser tests examples
          uv run --no-sync pytest
