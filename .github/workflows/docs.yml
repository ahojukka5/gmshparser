name: Documentation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: docs: build documentation
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: docs

      - name: Install documentation dependencies
        run: uv sync --no-default-groups --group docs

      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict

      - name: Verify README-backed homepage
        run: |
          python - <<'PY'
          from pathlib import Path

          homepage = Path("site/index.html").read_text(encoding="utf-8")
          expected = (
              "Periodic meshes",
              "NumPy interoperability",
              "Structured parser errors",
              "hero-image.webp",
          )
          missing = [value for value in expected if value not in homepage]
          if missing:
              raise SystemExit(
                  "Generated homepage is not using README.md; missing: "
                  + ", ".join(missing)
              )
          PY

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    name: docs: deploy documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: self-hosted
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
