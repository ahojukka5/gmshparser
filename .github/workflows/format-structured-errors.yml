name: Format structured parser errors

on:
  push:
    branches: [structured-parse-errors]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: uv sync --no-default-groups --group lint
      - run: uv run --no-sync ruff format gmshparser tests examples
      - name: Commit formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gmshparser tests examples
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "Format structured parser errors"
            git push origin HEAD:${{ github.ref_name }}
          fi
