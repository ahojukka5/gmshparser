name: Diagnose element type registry

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'element-type-registry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
      - run: uv sync --no-default-groups --group test
      - name: Run targeted tests
        id: tests
        continue-on-error: true
        run: |
          set +e
          uv run --no-sync pytest -q --tb=short tests/test_element_types.py \
            > element-type-registry-pytest.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: element-type-registry-pytest
          path: element-type-registry-pytest.txt
      - name: Propagate test result
        run: test "${{ steps.tests.outputs.status }}" = "0"
