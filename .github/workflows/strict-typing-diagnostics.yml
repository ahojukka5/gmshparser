name: Strict typing diagnostics

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'release/0.4.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Install typing dependencies
        run: uv sync --no-default-groups --group typing

      - name: Run strict package typing
        shell: bash
        run: |
          set -o pipefail
          uv run --no-sync mypy gmshparser 2>&1 | tee strict-typing.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-typing-diagnostics
          path: strict-typing.txt
          if-no-files-found: error
