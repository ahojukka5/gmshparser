name: Python CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: Ruff quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: quality

      - name: Install quality dependencies
        run: uv sync --no-default-groups --group lint

      - name: Check formatting
        run: uv run --no-sync ruff format --check gmshparser tests examples benchmarks

      - name: Lint
        run: uv run --no-sync ruff check gmshparser tests examples benchmarks

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: py${{ matrix.python-version }}

      - name: Install test dependencies
        run: uv sync --no-default-groups --group test

      - name: Test with pytest
        run: uv run --no-sync pytest --cov=gmshparser --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  package:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    needs: [quality, test]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: package

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke test wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "import gmshparser"
          uv run --isolated --no-project --with dist/*.whl gmshparser --version

      - name: Smoke test source distribution
        run: |
          uv run --isolated --no-project --with dist/*.tar.gz python -c "import gmshparser"
          uv run --isolated --no-project --with dist/*.tar.gz gmshparser --version

  prepare-periodic:
    name: Prepare periodic source files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: add-periodic-links

      - name: Extract and run preparation script
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/apply-periodic-links.yml").read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          block = workflow[start:end]

          output: list[str] = []
          in_literal = False
          for line in block.splitlines():
              if in_literal:
                  if "'''" in line:
                      normalized = line[10:] if line.startswith("          ") else line
                      output.append(normalized)
                      in_literal = False
                  else:
                      output.append(line)
                  continue

              normalized = line[10:] if line.startswith("          ") else line
              output.append(normalized)
              if normalized.count("'''") % 2:
                  in_literal = True

          Path("/tmp/apply_periodic.py").write_text("\n".join(output) + "\n")
          PY
          python /tmp/apply_periodic.py

      - name: Repair embedded newline in generated test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_periodic_links.py")
          lines = path.read_text().splitlines()
          for index, line in enumerate(lines):
              if line.strip() == '"16 1 0 0 1 0 1 0 0':
                  if lines[index + 1].strip() != '0 0 1 0 0 0 0 1",':
                      raise SystemExit("Unexpected affine continuation line")
                  lines[index] = (
                      '        "16 1 0 0 1 0 1 0 0\\n0 0 1 0 0 0 0 1",'
                  )
                  del lines[index + 1]
                  break
          else:
              raise SystemExit("Generated affine test string was not found")
          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Install validation dependencies
        run: uv sync --no-default-groups --group test --group lint --group docs

      - name: Capture generated-source lint result
        run: |
          set +e
          uv run --no-sync ruff format gmshparser tests > ruff-output.txt 2>&1
          uv run --no-sync ruff check --fix gmshparser tests >> ruff-output.txt 2>&1
          uv run --no-sync ruff format gmshparser tests >> ruff-output.txt 2>&1
          uv run --no-sync ruff check gmshparser tests >> ruff-output.txt 2>&1
          cat ruff-output.txt
          exit 0

      - name: Test generated implementation
        continue-on-error: true
        run: uv run --no-sync pytest

      - name: Build generated documentation
        continue-on-error: true
        run: uv run --no-sync mkdocs build --strict

      - name: Upload prepared files and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: periodic-links-files
          path: |
            ruff-output.txt
            gmshparser/__init__.py
            gmshparser/api.py
            gmshparser/main_parser.py
            gmshparser/mesh.py
            gmshparser/modern_builder.py
            gmshparser/periodic_parser.py
            tests/test_periodic_links.py
            README.md
            docs/api/modern.md
            docs/user-guide/pythonic-api.md
            docs/about/changelog.md
          if-no-files-found: error
