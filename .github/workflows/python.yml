name: Python CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: Ruff quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: quality

      - name: Install quality dependencies
        run: uv sync --no-default-groups --group lint

      - name: Check formatting
        run: uv run --no-sync ruff format --check gmshparser tests examples benchmarks

      - name: Lint
        run: uv run --no-sync ruff check gmshparser tests examples benchmarks

  typing:
    name: Static typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: typing

      - name: Install typing dependencies
        run: uv sync --no-default-groups --group typing

      - name: Check package typing
        shell: bash
        run: |
          set -o pipefail
          uv run --no-sync mypy gmshparser 2>&1 | tee mypy-package.txt

      - name: Check downstream public API typing
        shell: bash
        run: |
          set -o pipefail
          uv run --no-sync mypy --strict tests/typing/public_api.py 2>&1 | tee mypy-public-api.txt

      - name: Upload typing diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typing-diagnostics
          path: mypy-*.txt
          if-no-files-found: ignore

  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: py${{ matrix.python-version }}

      - name: Install test dependencies
        run: uv sync --no-default-groups --group test

      - name: Test with pytest
        run: uv run --no-sync pytest --cov=gmshparser --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  package:
    name: Build and smoke-test distributions
    runs-on: ubuntu-latest
    needs: [quality, typing, test]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          cache-suffix: package

      - name: Build distributions
        run: uv build --no-sources

      - name: Smoke test wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "import gmshparser"
          uv run --isolated --no-project --with dist/*.whl python -c "from importlib.resources import files; assert files('gmshparser').joinpath('py.typed').is_file()"
          uv run --isolated --no-project --with dist/*.whl gmshparser --version

      - name: Smoke test source distribution
        run: |
          uv run --isolated --no-project --with dist/*.tar.gz python -c "import gmshparser"
          uv run --isolated --no-project --with dist/*.tar.gz python -c "from importlib.resources import files; assert files('gmshparser').joinpath('py.typed').is_file()"
          uv run --isolated --no-project --with dist/*.tar.gz gmshparser --version
