name: Fix Pythonic API lint

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/pythonic-api'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Install development dependencies
        run: uv sync --no-default-groups --group test --group lint

      - name: Apply Ruff fixes
        run: |
          uv run --no-sync ruff check --fix --unsafe-fixes gmshparser tests examples || true
          uv run --no-sync ruff format gmshparser tests examples

      - name: Verify tests
        run: uv run --no-sync pytest

      - name: Collect remaining diagnostics
        run: uv run --no-sync ruff check --output-format=concise gmshparser tests examples > ruff-remaining.txt || true

      - name: Upload remaining diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: pythonic-api-ruff-remaining
          path: ruff-remaining.txt

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gmshparser tests examples
          if git diff --cached --quiet; then
            echo "No lint fixes to commit"
            exit 0
          fi
          git commit -m "Apply Ruff fixes to Pythonic API"
          git push origin HEAD:${{ github.head_ref }}
