[project]
name = "gmshparser"
version = "0.3.1"
description = "A lightweight, dependency-free Python package for parsing ASCII Gmsh MSH files"
authors = [
    { name = "Jukka Aho", email = "ahojukka5@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gmshparser = "gmshparser.cli:main"

[project.urls]
Documentation = "https://ahojukka5.github.io/gmshparser/"
Issues = "https://github.com/ahojukka5/gmshparser/issues"
Repository = "https://github.com/ahojukka5/gmshparser"

[dependency-groups]
test = [
    "pytest>=8,<10",
    "pytest-cov>=4,<8",
]
lint = [
    "black>=24,<27",
    "flake8>=7,<8",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
    "mkdocstrings[python]>=0.26,<1.1",
]
visualization = [
    "matplotlib>=3.5,<3.12",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gmshparser"
module-root = ""

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--cov=gmshparser -v --cov-report=term-missing"
testpaths = [
    "tests",
]
